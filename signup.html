<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">

  <script src="https://cdn.tailwindcss.com"></script>

  <title>Sign Up — DevPulse</title>

  <script>
    tailwind.config = { 
        theme: { 
            extend: { 
                colors: { 
                    neon: '#22c55e' 
                }, 
                fontFamily: { 
                    mono: ['JetBrains Mono','ui-monospace','SFMono-Regular','Menlo','monospace'] 
                }
            }
        }
    }
  </script>
</head>

<body class="bg-neutral-900 text-slate-200 font-mono min-h-screen flex flex-col">
  <header class="fixed top-0 left-0 right-0 z-50 bg-neutral-900/95 text-slate-100 backdrop-blur-sm border-b border-white/5">
    <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
      <div class="flex items-center gap-4">
        <div class="text-2xl font-extrabold">DevPulse</div>
        <div class="text-sm text-slate-400">API Manager</div>
      </div>
      
      <nav class="hidden md:flex items-center gap-4">
        <a href="index.html" class="text-slate-200 hover:text-white">Home</a>
        <a href="login.html" class="text-neon border border-neutral-700 px-3 py-1 rounded-md">Login</a>
      </nav>

      <div class="md:hidden">
        <button aria-label="menu" aria-expanded="false" id="menuBtn" class="text-slate-200">☰</button>
      </div>
    </div>

    <div id="mobileMenu" class="hidden md:hidden px-6 pb-4 border-t border-white/5">
      <nav class="flex flex-col gap-3">
        <a href="index.html" class="text-slate-200 py-2 mobile-link">Home</a>
        <a href="login.html" class="text-neon border border-neutral-700 px-3 py-2 rounded-md mobile-link">Login</a>
      </nav>
    </div>
  </header>

  <main class="flex-1 flex items-center justify-center">
    <div class="w-full max-w-md md:max-w-lg mx-4 sm:mx-6">
      <div class="bg-neutral-800/40 p-8 rounded-xl border border-white/10 shadow-lg">
        <h1 class="text-2xl font-bold text-neon mb-4">Create account</h1>
        <p class="text-slate-400 text-sm mb-6">Sign up to save a local account in your browser (demo only).</p>

        <form id="signupForm" novalidate>
          <div class="mb-4">
            <label class="block text-slate-300 text-sm mb-1">Email</label>
            <input id="email" type="email" class="w-full px-3 py-2 rounded bg-neutral-900/60 border border-white/5 focus:outline-none focus:ring-2 focus:ring-neon" required />
          </div>

          <div class="mb-4">
            <label class="block text-slate-300 text-sm mb-1">Password</label>
            <input id="password" type="password" class="w-full px-3 py-2 rounded bg-neutral-900/60 border border-white/5 focus:outline-none focus:ring-2 focus:ring-neon" required />
          </div>

          <div class="mb-4">
            <label class="block text-slate-300 text-sm mb-1">Confirm Password</label>
            <input id="confirm" type="password" class="w-full px-3 py-2 rounded bg-neutral-900/60 border border-white/5 focus:outline-none focus:ring-2 focus:ring-neon" required />
          </div>

          <div id="signupMsg" class="mb-4 text-sm"></div>

          <div class="flex items-center justify-between gap-3">
            <button type="submit" class="w-full inline-flex items-center justify-center px-4 py-2 bg-neon text-neutral-900 rounded font-semibold neon-glow">Sign up</button>
          </div>
        </form>

        <p class="mt-4 text-slate-400 text-sm">Already have an account? <a href="login.html" class="text-neon">Log in</a></p>
      </div>
    </div>
  </main>

  <footer class="bg-neutral-950 text-slate-200 border-t border-white/10 shadow-inner">
    <div class="max-w-6xl mx-auto px-6 py-6 flex flex-col md:flex-row items-center justify-between gap-4">
      <p class="text-neon">© DevPulse API Manager</p>
      
      <ul class="flex gap-6">
        <li><a href="#" class="text-neon hover:text-neon/90">About</a></li>
        <li><a href="#" class="text-neon hover:text-neon/90">Contact</a></li>
        <li><a href="#" class="text-neon hover:text-neon/90">Privacy</a></li>
      </ul>
    </div>
  </footer>

  <script src="script.js"></script>
  <script src="auth.js"></script>
  
  <script>
    document.getElementById('signupForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;
      const msg = document.getElementById('signupMsg');

      if (!email || !password || !confirm) {
        auth.showFormMessage(msg, 'Please fill in all fields', 'error');
        return;
      }
      if (password !== confirm) {
        auth.showFormMessage(msg, 'Passwords do not match', 'error');
        return;
      }

      const existing = auth.findUserByEmail(email);
      if (existing) {
        auth.showFormMessage(msg, 'An account with that email already exists', 'error');
        return;
      }

      auth.saveUser({ email, password });
      auth.showFormMessage(msg, 'Account created. Redirecting to login...', 'success');
      setTimeout(() => location.href = 'login.html', 900);
    });
  </script>
</body>
</html>
